version: 2

updates:
  # Flutter/Dart packages for the app.
  - package-ecosystem: pub
    directory: /app
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      pub-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']

  # The Gradle/Android side (AGP, Kotlin, the wrapper).
  - package-ecosystem: gradle
    directory: /app/android
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    # One PR per month, not three: the bumps interact (AGP 9.4 refuses to build
    # on a wrapper older than 9.6), so splitting them means the AGP PR is red
    # until the wrapper PR lands. Majors stay separate.
    groups:
      gradle-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']

  # The workflow actions themselves, which is how the action majors here stay
  # honest instead of rotting.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
