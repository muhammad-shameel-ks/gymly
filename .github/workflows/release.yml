name: Release

# Every push to `main` releases. One run does the whole thing:
#
#   release-please  → opens/updates the release PR (version bump + CHANGELOG)
#   publish         → merges that PR, then tags + publishes via release-please
#   android         → builds the signed APKs/AAB and attaches them
#
# It has to be one run. A tag or merge made with the default `GITHUB_TOKEN`
# does not trigger another workflow run, so `publish` merges the release PR and
# then cuts the tag itself, and `android` is gated on that tag in the same run.
#
# Commits decide the bump: `fix:` → patch, `feat:` → minor, `feat!:`/`BREAKING
# CHANGE:` → major. `chore:`/`ci:`/`docs:`/`build:` do not appear in the
# changelog and do not bump, so a push carrying only those opens no release PR
# and `publish` finds nothing to merge — the run stops there.
#
# Branch model: `main` is the release branch. Work lands through short-lived
# branches (`feat/<slug>`, `fix/<slug>`, `hotfix/<slug>`), and a hotfix is just a
# `fix:` branch cut from `main` and merged back the same way.
#
# Escape hatches: push a `v*` tag yourself, or `workflow_dispatch` with an
# existing tag to rebuild and re-attach the artifacts.
#
# Artifacts: per-ABI release APKs for sideloading plus the AAB for Play, signed
# with the upload key when the ANDROID_KEYSTORE_* secrets exist (debug-signed
# otherwise, and the APK names say so), Dart-obfuscated with the symbol files kept
# as a workflow artifact for de-minifying crash reports.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and attach
        required: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.5'
  JAVA_VERSION: '17'

jobs:
  release-please:
    name: Release PR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      prs_created: ${{ steps.release.outputs.prs_created }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Merge, tag, publish
    needs: release-please
    if: needs.release-please.outputs.prs_created == 'true'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.verify.outputs.tag }}
    steps:
      - name: Merge the release PR
        # `gh pr merge` here is the workflow's own token, so this push to `main`
        # triggers no further run — which is why the tag is cut in the step
        # below rather than by a second workflow run. GitHub computes a fresh
        # PR's mergeability asynchronously, so the first attempt can race it.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ fromJSON(needs.release-please.outputs.pr).number }}
          PR_RAW: ${{ needs.release-please.outputs.pr }}
        run: |
          echo "release PR: #$PR"
          echo "action output: $PR_RAW"
          for attempt in 1 2 3 4 5; do
            if gh pr merge "$PR" --squash --delete-branch; then
              exit 0
            fi
            echo "attempt $attempt: not mergeable yet, retrying"
            sleep 5
          done
          echo "::error::could not merge release PR #$PR"
          exit 1
      - uses: googleapis/release-please-action@v5
        id: tag
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # Tag the PR merged above (still labelled `autorelease: pending`)
          # without opening the next release PR in the same breath.
          skip-github-pull-request: true
      - name: Verify the tag
        # Derived from the manifest the merge just bumped rather than from the
        # action's per-path outputs, so the tag format is checked here too:
        # `v<version>` holds while `include-component-in-tag` stays false.
        id: verify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(gh api "repos/${{ github.repository }}/contents/.release-please-manifest.json?ref=main" \
            --jq .content | base64 -d | jq -r 'to_entries[0].value')
          tag="v$version"
          gh api "repos/${{ github.repository }}/git/ref/tags/$tag" >/dev/null \
            || { echo "::error::release-please did not create $tag"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  android:
    name: Android artifacts
    needs: [release-please, publish]
    if: |
      always() && (
        needs.publish.outputs.tag != '' ||
        startsWith(github.ref, 'refs/tags/v') ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || needs.publish.outputs.tag || github.ref }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve the release tag
        # From the trigger itself: the dispatch input, the tag release-please
        # just cut, or the tag that was pushed. No `git describe`, so the
        # checkout depth cannot make this fail.
        run: echo "TAG=${{ github.event.inputs.tag || needs.publish.outputs.tag || github.ref_name }}" >> "$GITHUB_ENV"
      - name: Write the signing config
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$RUNNER_TEMP/upload-keystore.jks
          EOF
      - name: Packages
        run: flutter pub get
      - name: Build the app bundle
        run: >
          flutter build appbundle --release --obfuscate
          --split-debug-info=build/symbols --build-number=${{ github.run_number }}
      - name: Build the split APKs
        run: >
          flutter build apk --release --split-per-abi --obfuscate
          --split-debug-info=build/symbols --build-number=${{ github.run_number }}
      - name: Name the artifacts
        run: |
          mkdir -p dist
          suffix=""
          [ "$KEYSTORE_B64" = "" ] && suffix="-debugsigned"
          cp build/app/outputs/bundle/release/app-release.aab "dist/gymly-$TAG$suffix.aab"
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi=$(basename "$apk" | sed 's/^app-\(.*\)-release\.apk$/\1/')
            cp "$apk" "dist/gymly-$TAG-$abi$suffix.apk"
          done
          ls -la dist
      - name: Signing check
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for apk in dist/*.apk; do
            echo "== $apk"
            "$APKSIGNER" verify --print-certs "$apk" | head -3
          done
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "Gymly $TAG" --generate-notes
          gh release upload "$TAG" dist/* --clobber
      - uses: actions/upload-artifact@v7
        with:
          name: gymly-symbols-${{ github.ref_name }}
          if-no-files-found: error
          path: app/build/symbols/*
