name: CI

# Pull-request and main-branch verification: static analysis, the whole test
# suite, and — in parallel, because wall-clock matters more than a wasted job —
# the same release-mode APK shape the release builds, so a break in the Android
# toolchain surfaces on the PR, not on the tag.
#
# Caching: `subosito/flutter-action` caches the Flutter SDK + pub cache keyed on
# `pubspec.lock`; `gradle/actions/setup-gradle` owns the Gradle dependency and
# build caches (and reports the build scan). Nothing is cached by hand.

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', '.scratch/**']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', '.scratch/**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.5'
  JAVA_VERSION: '17'

jobs:
  checks:
    name: Analyze and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Packages
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test

  apk:
    name: Release APKs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Write the signing config
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$RUNNER_TEMP/upload-keystore.jks
          EOF
      - name: Packages
        run: flutter pub get
      - name: Build split APKs
        run: >
          flutter build apk --release --split-per-abi --obfuscate
          --split-debug-info=build/symbols --build-number=${{ github.run_number }}
      - name: Network permission in the release APK
        # Release builds inherit `src/main/AndroidManifest.xml` only. INTERNET is
        # declared in the debug/profile manifests for the Flutter tool, so a
        # release APK missing it in `main` installs and launches fine and then
        # fails every call with "Failed host lookup". Assert it on the built
        # artifact, not on the source.
        run: |
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          APK=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          "$AAPT2" dump badging "$APK" | grep -q "android.permission.INTERNET" \
            || { echo "::error::$APK declares no INTERNET permission - release builds would have no network"; exit 1; }
      - name: Signing check
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            echo "== $apk"
            "$APKSIGNER" verify --print-certs "$apk" | head -3
          done
      - uses: actions/upload-artifact@v7
        with:
          name: gymly-apks-${{ github.sha }}
          if-no-files-found: error
          path: |
            app/build/app/outputs/flutter-apk/*.apk
            app/build/symbols/*
